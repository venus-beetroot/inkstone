<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inkstone</title>
<meta name="description" content="Japanese kanji and Chinese hanzi with FSRS spaced repetition, stroke practice and audio.">
<meta name="theme-color" content="#12110e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Inkstone">
<link rel="apple-touch-icon" href="__ICON__">
<link rel="icon" href="__ICON__">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,400&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Noto+Serif+JP:wght@400;600&family=Noto+Serif+SC:wght@400;600&family=Klee+One:wght@400;600&display=swap">
<style>
:root{
  --bg:#f3eee3;--surface:#fbf8f1;--surface-2:#ece5d6;--line:#dcd2bd;--line-2:#c6b99e;
  --ink:#1c1914;--ink-2:#4f4739;--ink-3:#7f7461;
  --brass:#8a6519;--brass-2:#b48a33;--brass-soft:rgba(138,101,25,.10);
  --moss:#4c6832;--moss-soft:rgba(76,104,50,.12);
  --rust:#9c431c;--rust-soft:rgba(156,67,28,.10);
  --slate:#35607f;
  --heat-0:#e6dece;--heat-1:#e6d3a2;--heat-2:#cfab5c;--heat-3:#a47b25;--heat-4:#6b4f12;
  --scrim:rgba(28,25,20,.45);
  --f-display:"Fraunces",Georgia,serif;
  --f-body:"Source Serif 4",Georgia,serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --f-ja:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-zh:"Noto Serif SC","Songti SC","STSong",serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#12110e;--surface:#1a1814;--surface-2:#23201a;--line:#2e2a22;--line-2:#3f392d;
    --ink:#ece4d3;--ink-2:#b9ad97;--ink-3:#877c69;
    --brass:#d0a94f;--brass-2:#e2c37a;--brass-soft:rgba(208,169,79,.12);
    --moss:#93ad6c;--moss-soft:rgba(147,173,108,.14);
    --rust:#d6774f;--rust-soft:rgba(214,119,79,.14);
    --slate:#86a7c2;
    --heat-0:#23201a;--heat-1:#4a3d1e;--heat-2:#7a6026;--heat-3:#b08a36;--heat-4:#e8cb86;
    --scrim:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12110e;--surface:#1a1814;--surface-2:#23201a;--line:#2e2a22;--line-2:#3f392d;
  --ink:#ece4d3;--ink-2:#b9ad97;--ink-3:#877c69;
  --brass:#d0a94f;--brass-2:#e2c37a;--brass-soft:rgba(208,169,79,.12);
  --moss:#93ad6c;--moss-soft:rgba(147,173,108,.14);
  --rust:#d6774f;--rust-soft:rgba(214,119,79,.14);
  --slate:#86a7c2;
  --heat-0:#23201a;--heat-1:#4a3d1e;--heat-2:#7a6026;--heat-3:#b08a36;--heat-4:#e8cb86;
  --scrim:rgba(0,0,0,.6);
  color-scheme:dark;
}
:root[data-cjk="textbook"]{--f-ja:"Klee One","Noto Serif JP","Hiragino Mincho ProN",serif}

*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{background:var(--bg);color:var(--ink);font:400 17px/1.55 var(--f-body);min-height:100vh;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px;border-radius:6px}
[lang="ja"]{font-family:var(--f-ja)}
[lang="zh-Hans"]{font-family:var(--f-zh)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.app{max-width:760px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 22px) 16px calc(104px + env(safe-area-inset-bottom))}
.kicker{font:500 11px/1.4 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
h1{font:350 46px/1.02 var(--f-display);font-variation-settings:"opsz" 144;letter-spacing:-.015em;margin-top:6px}
h2{font:450 21px/1.25 var(--f-display);font-variation-settings:"opsz" 40;margin-bottom:12px}
h3{font:500 11px/1.4 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-bottom:10px}
p+p{margin-top:8px}
.muted{color:var(--ink-2)}.faint{color:var(--ink-3)}
.mono{font-family:var(--f-mono)}
.section{margin-top:28px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.panel+.panel{margin-top:12px}
.stack>*+*{margin-top:12px}
.rowflex{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spread{display:flex;align-items:center;justify-content:space-between;gap:12px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:10px;border:1px solid var(--line-2);font:500 12px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--brass);border-color:var(--brass);color:var(--bg)}
.btn.primary:hover{background:var(--brass-2);border-color:var(--brass-2)}
.btn.block{width:100%}
.btn.small{min-height:34px;padding:0 12px;font-size:11px}
.btn.danger{color:var(--rust);border-color:var(--rust)}
.btn[disabled]{opacity:.45;pointer-events:none}
.icon-btn{width:44px;height:44px;display:inline-grid;place-items:center;border-radius:10px;color:var(--ink-2)}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn[aria-pressed="true"]{color:var(--brass)}
.icon-btn svg{width:22px;height:22px}
.chip{display:inline-flex;align-items:center;min-height:34px;padding:0 13px;border-radius:999px;border:1px solid var(--line-2);font:500 12px/1 var(--f-mono);letter-spacing:.06em;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--brass-soft);border-color:var(--brass);color:var(--brass)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.seg{display:flex;border:1px solid var(--line-2);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;min-height:36px;border-radius:7px;font:500 11px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.seg button[aria-pressed="true"]{background:var(--surface-2);color:var(--ink)}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;justify-content:center;background:var(--bg);background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;max-width:180px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0 9px;font:500 10px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-current="page"]{color:var(--brass)}

/* Today */
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:16px}
.streak{text-align:right}
.streak b{display:block;font:350 46px/1 var(--f-display);font-variation-settings:"opsz" 144;color:var(--brass)}
.goal{height:4px;border-radius:4px;background:var(--surface-2);overflow:hidden;margin-top:10px}
.goal i{display:block;height:100%;background:var(--brass);border-radius:4px;transition:width .4s}
.lang-card{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center}
.lang-card .name{font:450 22px/1.2 var(--f-display)}
.lang-card .name span{font-size:15px;color:var(--ink-3);margin-left:8px;font-family:var(--f-body)}
.counts{display:flex;gap:16px;margin-top:6px;font:500 12px/1.3 var(--f-mono);color:var(--ink-3)}
.counts b{font-weight:500;font-size:16px;display:block}
.c-new b{color:var(--slate)}.c-lrn b{color:var(--rust)}.c-rev b{color:var(--moss)}
.glance{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center;text-align:left;width:100%}
.glance .g-char{font-size:84px;line-height:1;min-width:92px;text-align:center}
.glance .g-mean{font:italic 400 19px/1.35 var(--f-display);margin-top:4px}

/* Study overlay */
.overlay{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;animation:fade .18s ease}
.study-top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) 8px 8px;border-bottom:1px solid var(--line)}
.study-top .counts{margin:0;gap:14px;align-items:baseline}
.study-top .counts span{display:flex;gap:5px;align-items:baseline}
.study-top .counts b{display:inline;font-size:15px}
.study-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:26px 16px 32px}
.study-inner{max-width:640px;margin:0 auto;text-align:center}
.head-big{line-height:1.08;margin:18px 0 6px;word-break:keep-all}
.hs-1{font-size:clamp(110px,36vw,200px)}
.hs-2{font-size:clamp(76px,22vw,128px)}
.hs-3{font-size:clamp(56px,15vw,96px)}
.hs-4{font-size:clamp(40px,11vw,72px)}
.prompt{font:italic 400 17px/1.4 var(--f-display);color:var(--ink-3);margin-top:18px}
.answer{margin-top:18px;text-align:left;animation:rise .22s ease}
.answer .meaning{font:400 24px/1.3 var(--f-display);font-variation-settings:"opsz" 36;text-align:center;margin:8px 0 18px}
.readings{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.reading{display:inline-flex;align-items:baseline;gap:6px;min-height:38px;padding:4px 12px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-size:20px}
.reading .tag{font:500 10px var(--f-mono);letter-spacing:.1em;color:var(--ink-3)}
.reading:hover{border-color:var(--brass)}
.oku{color:var(--ink-3)}
.big-read{font-size:30px;text-align:center;line-height:1.3}
.romaji{font:400 14px var(--f-mono);color:var(--ink-3);text-align:center;margin-top:2px}
.t1{color:var(--rust)}.t2{color:var(--brass)}.t3{color:var(--moss)}.t4{color:var(--slate)}.t5{color:var(--ink-3)}
.pinyin{font:500 28px/1.3 var(--f-body);text-align:center}
.pinyin .alt{color:var(--ink-3);font-size:18px}
.facts-row{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 18px;margin-top:14px;font:400 13px var(--f-mono);color:var(--ink-3)}
.sub{margin-top:22px}
.sub h3{text-align:left}
.study-foot{padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--bg)}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:640px;margin:0 auto}
.rate button{min-height:62px;border-radius:12px;border:1px solid var(--line-2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:500 12px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase}
.rate .ivl{font:400 12px/1 var(--f-mono);color:var(--ink-3);letter-spacing:0;text-transform:none}
.rate .r1{color:var(--rust);border-color:var(--rust)}
.rate .r2{color:var(--ink-2)}
.rate .r3{color:var(--moss);border-color:var(--moss)}
.rate .r4{color:var(--brass);border-color:var(--brass)}
.rate button:active{transform:scale(.97)}
.show-btn{max-width:640px;margin:0 auto;display:block}
.note-card{margin-top:18px;padding:12px 14px;border-left:3px solid var(--brass);background:var(--brass-soft);border-radius:0 10px 10px 0;text-align:left;white-space:pre-wrap}
.done{text-align:center;padding-top:10vh}
.done h2{font-size:34px;font-weight:350}

/* Lists */
.row{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;width:100%;text-align:left;padding:12px 4px;border-bottom:1px solid var(--line)}
.row:hover{background:var(--surface)}
.row-head{font-size:30px;line-height:1.1;min-width:44px;text-align:center}
.row-head.long{font-size:22px}
.row-mid{min-width:0}
.row-read{display:block;font-size:14px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-mean{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-side{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.lv{font:500 10px/1 var(--f-mono);letter-spacing:.08em;color:var(--ink-3);border:1px solid var(--line-2);border-radius:5px;padding:4px 6px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%}
.dot.lrn{background:var(--rust)}.dot.rev{background:var(--moss)}.dot.sus{background:var(--ink-3)}
.search{width:100%;height:50px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface);padding:0 16px;font-size:17px}
.search:focus{outline:none;border-color:var(--brass)}
.filters{display:grid;gap:10px;margin:14px 0 6px}
.empty{padding:40px 0;text-align:center;color:var(--ink-3);font-style:italic}

/* Sheet */
.scrim{position:fixed;inset:0;z-index:30;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s ease}
.sheet{position:relative;background:var(--surface);width:100%;max-width:680px;max-height:94vh;overflow-y:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0;padding:14px 18px calc(28px + env(safe-area-inset-bottom));animation:up .24s cubic-bezier(.2,.8,.2,1)}
@media (min-width:760px){.scrim{align-items:center;padding:24px}.sheet{border-radius:18px;border-bottom:1px solid var(--line);max-height:90vh}}
.sheet-top{display:flex;align-items:center;justify-content:space-between;gap:8px;position:sticky;top:-14px;background:var(--surface);padding:6px 0;z-index:2}
.d-hero{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center;margin:8px 0 6px}
.d-char{font-size:104px;line-height:1;text-align:center;min-width:112px}
.d-char.word{font-size:52px;min-width:0}
.d-hero.wordhero{grid-template-columns:1fr}
.d-hero.wordhero .d-char{text-align:left}
.d-mean{font:400 22px/1.3 var(--f-display);font-variation-settings:"opsz" 36;margin-top:8px}
.d-hero .readings{justify-content:flex-start}
.d-hero .pinyin,.d-hero .big-read,.d-hero .romaji{text-align:left}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:15px}
.facts dt{font:500 11px/1.9 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.comp{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:4px 12px 4px 8px;border-radius:10px;border:1px solid var(--line);background:var(--bg)}
.comp .c{font-size:26px;line-height:1}
.comp .m{font-size:13px;color:var(--ink-2);max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button.comp:hover{border-color:var(--brass)}
.stroke-wrap{display:flex;flex-direction:column;align-items:center;gap:12px}
.hw{position:relative;border:1px solid var(--line-2);border-radius:12px;background:var(--bg);touch-action:none}
.hw .grid{position:absolute;inset:0;pointer-events:none}
.hw svg{display:block}
.hw svg:not(.grid){position:relative}
.hw-msg{min-height:22px;font:400 13px var(--f-mono);color:var(--ink-3);text-align:center}
textarea.notes{width:100%;min-height:84px;border-radius:10px;border:1px solid var(--line-2);background:var(--bg);padding:10px 12px;resize:vertical;font-size:16px}
textarea.notes:focus{outline:none;border-color:var(--brass)}
.pitch{display:flex;flex-direction:column;align-items:center;gap:2px;margin:10px 0 0}
.d-hero .pitch{align-items:flex-start}
.pitch svg{overflow:visible}

/* Stats */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:600px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.tile b{display:block;font:350 34px/1.1 var(--f-display);font-variation-settings:"opsz" 96;margin-top:6px}
.tile small{font:400 12px var(--f-mono);color:var(--ink-3)}
.chart-tip{font:400 13px var(--f-mono);color:var(--ink-2);min-height:20px;margin-top:8px}
.heat rect.cell{rx:2px}
.heat text,.bars text{font:400 10px var(--f-mono);fill:var(--ink-3)}
.legend{display:flex;align-items:center;gap:4px;justify-content:flex-end;font:400 11px var(--f-mono);color:var(--ink-3);margin-top:6px}
.legend i{width:11px;height:11px;border-radius:2px;display:inline-block}
.prog{display:grid;grid-template-columns:112px 1fr auto;gap:12px;align-items:center;font:400 13px var(--f-mono);padding:6px 0}
.prog .bar{height:6px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--brass);border-radius:6px}
.prog span:last-child{color:var(--ink-3);min-width:78px;text-align:right}
table.tbl{width:100%;border-collapse:collapse;font:400 13px var(--f-mono);margin-top:8px}
table.tbl td,table.tbl th{padding:5px 4px;border-bottom:1px solid var(--line);text-align:left}
details summary{cursor:pointer;font:500 11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-top:10px}

/* Settings */
.set{display:grid;grid-template-columns:1fr auto;gap:6px 16px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.set:last-child{border-bottom:0}
.set label,.set .lbl{font-size:16px}
.set .help{grid-column:1/-1;font-size:14px;color:var(--ink-3)}
.set.col{grid-template-columns:1fr}
select,input[type="number"]{height:40px;border-radius:9px;border:1px solid var(--line-2);background:var(--bg);padding:0 10px;font:400 14px var(--f-mono);max-width:210px}
input[type="range"]{width:100%;accent-color:var(--brass)}
.switch{position:relative;width:50px;height:30px;border-radius:30px;background:var(--line-2);transition:background .15s;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .18s}
.switch[aria-checked="true"]{background:var(--brass)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
.val{font:500 14px var(--f-mono);color:var(--brass)}
.credits{font-size:14px;color:var(--ink-2)}
.lockprev{margin-top:8px;padding:22px 18px;border-radius:16px;background:linear-gradient(135deg,#2a3440,#1c2330 55%,#2d2436);display:flex;justify-content:center}
.lockprev .w{display:flex;align-items:center;gap:10px;width:170px;height:72px;padding:8px 10px;border-radius:14px;background:rgba(255,255,255,.14);color:rgba(255,255,255,.92);overflow:hidden}
.lockprev .h{font-size:40px;line-height:1;flex:none}
.lockprev .h.w2{font-size:28px}.lockprev .h.w3{font-size:20px}
.lockprev .t{min-width:0;font:600 13px/1.25 -apple-system,system-ui,sans-serif}
.lockprev .t span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lockprev .t .m{font-weight:400;font-size:12px;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
ol.steps{margin:10px 0 0 20px;font-size:15px;color:var(--ink-2)}
ol.steps li{margin-top:6px}
code.p{font:400 13px var(--f-mono);background:var(--surface-2);padding:1px 5px;border-radius:5px;color:var(--ink)}
.credits li{margin:6px 0 0 18px}

#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;z-index:50;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font:500 13px var(--f-mono);pointer-events:none;transition:opacity .2s,transform .2s;max-width:calc(100% - 32px);text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
.banner{background:var(--rust-soft);border:1px solid var(--rust);color:var(--ink);border-radius:12px;padding:12px 14px;font-size:15px;margin-bottom:16px}

<script>
(() => {
'use strict';

/* ================= Constants and helpers ================= */
const MIN = 60e3, HOUR = 3600e3, DAY = 86400e3, ROLLOVER_HOUR = 4, LEARN_AHEAD = 20 * MIN;
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const toKata = s => s.replace(/[ぁ-ゖ]/g, c => String.fromCharCode(c.charCodeAt(0) + 0x60));
const toHira = s => s.replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
const cleanKana = s => s.replace(/[.\-]/g, '');
const toneless = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const L = it => it.lang === 'ja' ? 'ja' : 'zh-Hans';
const LANG_NAME = {ja: 'Japanese', zh: 'Chinese'};
const LANG_NATIVE = {ja: '日本語', zh: '中文'};
const LEVELS = {ja: [5, 4, 3, 2, 1], zh: [1, 2, 3, 4, 5, 6, 7]};
const lvLabel = (lang, lv) => lang === 'ja' ? 'N' + lv : (lv === 7 ? 'HSK 7-9' : 'HSK ' + lv);
const KIND_LABEL = {jk: 'Kanji', hz: 'Hanzi', jw: 'Word', zw: 'Word'};
const KINDS = {ja: {char: 'jk', word: 'jw'}, zh: {char: 'hz', word: 'zw'}};
const isChar = it => it.kind === 'jk' || it.kind === 'hz';

const ICON = {
  close: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  speak: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>',
  star: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m12 3.5 2.6 5.4 5.9.8-4.3 4.1 1 5.8L12 16.8l-5.2 2.8 1-5.8L3.5 9.7l5.9-.8z"/></svg>',
  starOn: '<svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.6"><path d="m12 3.5 2.6 5.4 5.9.8-4.3 4.1 1 5.8L12 16.8l-5.2 2.8 1-5.8L3.5 9.7l5.9-.8z"/></svg>',
  undo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9 7 4.5 11.5 9 16"/><path d="M5 11.5h9a5 5 0 0 1 0 10h-2"/></svg>',
  info: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5.5M12 7.6v.2"/></svg>',
};

/* ================= Dataset ================= */
const RAW = JSON.parse(document.getElementById('data').textContent);
const ITEMS = new Map();
const LISTS = {jk: [], hz: [], jw: [], zw: []};
let ORD = 0;
function add(it) { if (ITEMS.has(it.id)) return; it.ord = ORD++; ITEMS.set(it.id, it); LISTS[it.kind].push(it); }
for (const [ch, lv, strokes, freq, mean, on, kun, comps, origin] of RAW.kanji)
  add({id: 'jk:' + ch, kind: 'jk', lang: 'ja', head: ch, lv, strokes, freq, mean, on: on ? on.split(' ') : [], kun: kun ? kun.split(' ') : [], comps, origin});
for (const [w, r, mean, lv, pitch] of RAW.jv)
  add({id: 'jw:' + w + '|' + r, kind: 'jw', lang: 'ja', head: w, r, mean, lv, pitch});
for (const [ch, lv, q, py, mean, trad, comps, origin] of RAW.hanzi)
  add({id: 'hz:' + ch, kind: 'hz', lang: 'zh', head: ch, lv, q, py: py ? py.split(' ') : [], mean, trad, comps, origin});
for (const [w, py, mean, lv, q, trad] of RAW.zv)
  add({id: 'zw:' + w, kind: 'zw', lang: 'zh', head: w, py: [py], mean, lv, q, trad});
const WORDS_BY_CHAR = {ja: new Map(), zh: new Map()};
for (const it of [...LISTS.jw, ...LISTS.zw]) {
  const m = WORDS_BY_CHAR[it.lang];
  for (const ch of new Set(it.head)) { if (!m.has(ch)) m.set(ch, []); m.get(ch).push(it); }
}
const charItem = (ch, lang) => ITEMS.get((lang === 'ja' ? 'jk:' : 'hz:') + ch);

/* ================= Storage ================= */
const KEY = 'inkstone:v1';
const DEFAULTS = {
  langs: {ja: true, zh: true},
  decks: {jk: [5], jw: [5], hz: [1], zw: [1]},
  newPerDay: {ja: 10, zh: 10},
  maxReviews: 300,
  retention: 0.9,
  theme: 'dark', cjkFont: 'serif', romaji: false, speakOnReveal: false,
  voice: {ja: '', zh: ''}, rate: 0.9,
  widget: {src: 'learning', chars: true, words: true, max: 200},
  onboarded: false,
};
let STORAGE_OK = true;
try { localStorage.setItem('inkstone:test', '1'); localStorage.removeItem('inkstone:test'); } catch (e) { STORAGE_OK = false; }
function normalize(o) {
  const s = Object.assign({}, DEFAULTS, o.settings || {});
  for (const k of ['langs', 'decks', 'newPerDay', 'voice', 'widget']) s[k] = Object.assign({}, DEFAULTS[k], (o.settings || {})[k] || {});
  return {v: 1, settings: s, cards: o.cards || {}, log: o.log || {}, notes: o.notes || {}, starred: o.starred || {}};
}
let S = (() => { try { const raw = STORAGE_OK && localStorage.getItem(KEY); if (raw) return normalize(JSON.parse(raw)); } catch (e) {} return normalize({}); })();
let saveTimer = null;
function save(now) {
  clearTimeout(saveTimer);
  const doSave = () => { if (!STORAGE_OK) return; try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast('Could not save progress: storage is full or blocked'); } };
  if (now) doSave(); else saveTimer = setTimeout(doSave, 250);
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') save(true); });
window.addEventListener('pagehide', () => save(true));

/* ================= Days ================= */
function dayStart(t = Date.now()) { const d = new Date(t); d.setHours(ROLLOVER_HOUR, 0, 0, 0); if (d.getTime() > t) d.setDate(d.getDate() - 1); return d.getTime(); }
function addDays(t, n) { const d = new Date(t); d.setDate(d.getDate() + n); return d.getTime(); }
function dayEnd(t = Date.now()) { return addDays(dayStart(t), 1); }
function dayKey(t = Date.now()) { const d = new Date(dayStart(t)); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
const EMPTY_LOG = () => ({r: 0, n: {ja: 0, zh: 0}, rv: 0, p: 0, ms: 0, x: {ja: 0, zh: 0}});
function peekLog(k = dayKey()) { return S.log[k] || EMPTY_LOG(); }
function todayLog() { const k = dayKey(); if (!S.log[k]) S.log[k] = EMPTY_LOG(); const l = S.log[k]; l.n = l.n || {ja: 0, zh: 0}; l.x = l.x || {ja: 0, zh: 0}; return l; }
function streaks() {
  let cur = 0, t = dayStart();
  if (!(peekLog(dayKey(t)).r > 0)) t = addDays(t, -1);
  while (peekLog(dayKey(t)).r > 0) { cur++; t = addDays(t, -1); }
  const keys = Object.keys(S.log).filter(k => S.log[k].r > 0).sort();
  let best = 0, run = 0, prev = null;
  for (const k of keys) {
    const d = new Date(k + 'T12:00:00').getTime();
    run = prev !== null && Math.round((d - prev) / DAY) === 1 ? run + 1 : 1;
    best = Math.max(best, run); prev = d;
  }
  return {cur, best: Math.max(best, cur)};
}

/* ================= FSRS-5 ================= */
const W = [0.40255, 1.18385, 3.173, 15.69105, 7.1949, 0.5345, 1.4604, 0.0046, 1.54575, 0.1192, 1.01925, 1.9395, 0.11, 0.29605, 2.2698, 0.2315, 2.9898, 0.51655, 0.6621];
const DECAY = -0.5, FACTOR = 19 / 81;
const LEARN_STEPS = [1 * MIN, 10 * MIN], RELEARN_STEPS = [10 * MIN];
const clampD = d => clamp(d, 1, 10);
const retr = (t, s) => Math.pow(1 + FACTOR * t / s, DECAY);
const initS = g => Math.max(W[g - 1], 0.1);
const initDRaw = g => W[4] - Math.exp(W[5] * (g - 1)) + 1;
const initD = g => clampD(initDRaw(g));
const nextD = (d, g) => { const d2 = d + (10 - d) * (-W[6] * (g - 3)) / 9; return clampD(W[7] * initDRaw(4) + (1 - W[7]) * d2); };
const recallS = (d, s, r, g) => s * (1 + Math.exp(W[8]) * (11 - d) * Math.pow(s, -W[9]) * (Math.exp((1 - r) * W[10]) - 1) * (g === 2 ? W[15] : 1) * (g === 4 ? W[16] : 1));
const forgetS = (d, s, r) => Math.min(W[11] * Math.pow(d, -W[12]) * (Math.pow(s + 1, W[13]) - 1) * Math.exp((1 - r) * W[14]), s / Math.exp(W[17] * W[18]));
const shortS = (s, g) => s * Math.exp(W[17] * (g - 3 + W[18]));
const ivlDays = s => clamp(Math.round(s / FACTOR * (Math.pow(S.settings.retention, 1 / DECAY) - 1)), 1, 36500);
const newCard = () => ({st: 0, s: 0, d: 0, due: 0, last: 0, step: 0, reps: 0, lapses: 0});

function stepCard(c0, g, now) {
  const c = Object.assign({}, c0);
  const elapsed = c.last ? (now - c.last) / DAY : 0;
  const graduate = () => { c.st = 2; c.step = 0; c.due = addDays(dayStart(now), ivlDays(c.s)); };
  if (c.st === 0) {
    c.s = initS(g); c.d = initD(g); c.st = 1; c.step = 0;
  } else {
    if (elapsed < 1) c.s = shortS(c.s, g);
    else { const r = retr(elapsed, c.s); c.s = g === 1 ? forgetS(c.d, c.s, r) : recallS(c.d, c.s, r, g); }
    c.s = Math.max(c.s, 0.01);
    c.d = nextD(c.d, g);
  }
  if (c.st === 1 || c.st === 3) {
    const steps = c.st === 1 ? LEARN_STEPS : RELEARN_STEPS;
    if (g === 1) { c.step = 0; c.due = now + steps[0]; }
    else if (g === 2) { c.due = now + (c.step === 0 ? (steps.length > 1 ? (steps[0] + steps[1]) / 2 : steps[0] * 1.5) : steps[c.step]); }
    else if (g === 3) { if (c.step + 1 >= steps.length) graduate(); else { c.step++; c.due = now + steps[c.step]; } }
    else graduate();
  } else if (g === 1) {
    c.st = 3; c.step = 0; c.lapses = (c.lapses || 0) + 1; c.due = now + RELEARN_STEPS[0];
  } else graduate();
  c.last = now; c.reps = (c.reps || 0) + 1;
  return c;
}
function preview(c0, now) {
  const out = [null, stepCard(c0, 1, now), stepCard(c0, 2, now), stepCard(c0, 3, now), stepCard(c0, 4, now)];
  const base = dayStart(now), days = g => Math.round((out[g].due - base) / DAY);
  if (c0.st === 2) {
    const h = days(2); let gd = days(3), e = days(4);
    if (gd <= h) { gd = h + 1; out[3].due = addDays(base, gd); }
    if (e <= gd) { e = gd + 1; out[4].due = addDays(base, e); }
  }
  return out;
}
function ivlLabel(c, now) {
  if (c.st === 2) { const d = Math.round((c.due - dayStart(now)) / DAY); return fmtDays(d); }
  const ms = c.due - now;
  return ms < HOUR ? Math.max(1, Math.round(ms / MIN)) + 'm' : Math.round(ms / HOUR) + 'h';
}
function fmtDays(d) {
  if (d < 1) return (d * 24).toFixed(0) + 'h';
  if (d < 30) return Math.round(d) + 'd';
  if (d < 365) return (d / 30.4).toFixed(1).replace(/\.0$/, '') + 'mo';
  return (d / 365).toFixed(1).replace(/\.0$/, '') + 'y';
}
function relTime(t) {
  const now = Date.now(), ms = t - now;
  if (ms <= 0) return 'now';
  if (ms < HOUR) return 'in ' + Math.max(1, Math.round(ms / MIN)) + ' min';
  if (t < dayEnd(now)) return 'in ' + Math.round(ms / HOUR) + ' h';
  const d = Math.round((dayStart(t) - dayStart(now)) / DAY);
  if (d === 1) return 'tomorrow';
  if (d < 30) return 'in ' + d + ' days';
  return new Date(t).toLocaleDateString(undefined, {day: 'numeric', month: 'short', year: d > 300 ? 'numeric' : undefined});
}

/* ================= Queues ================= */
const langOn = l => !!S.settings.langs[l];
let POOL = {};
function invalidatePool() { POOL = {}; }
function pool(lang) {
  if (POOL[lang]) return POOL[lang];
  const k = KINDS[lang], dk = S.settings.decks;
  const chars = LISTS[k.char].filter(it => dk[k.char].includes(it.lv));
  const words = LISTS[k.word].filter(it => dk[k.word].includes(it.lv));
  const merged = [];
  for (let i = 0; i < Math.max(chars.length, words.length); i++) { if (chars[i]) merged.push(chars[i]); if (words[i]) merged.push(words[i]); }
  const starred = Object.keys(S.starred).map(id => ITEMS.get(id)).filter(it => it && it.lang === lang);
  const seen = new Set();
  return (POOL[lang] = [...starred, ...merged].filter(it => !seen.has(it.id) && seen.add(it.id)));
}
const newLeft = l => { const g = peekLog(); return Math.max(0, S.settings.newPerDay[l] + ((g.x || {})[l] || 0) - ((g.n || {})[l] || 0)); };
function nextNewIds(lang, limit) {
  const out = [];
  if (!langOn(lang) || limit <= 0) return out;
  for (const it of pool(lang)) { const c = S.cards[it.id]; if (!c || (c.st === 0 && !c.susp)) { out.push(it.id); if (out.length >= limit) break; } }
  return out;
}
function scan(lang) {
  const now = Date.now(), end = dayEnd(now);
  const learnNow = [], learnAhead = [], review = [];
  for (const id in S.cards) {
    const c = S.cards[id]; if (c.susp || c.st === 0) continue;
    const it = ITEMS.get(id); if (!it || !langOn(it.lang) || (lang !== 'all' && it.lang !== lang)) continue;
    if (c.st === 1 || c.st === 3) { if (c.due <= now) learnNow.push(id); else if (c.due <= now + LEARN_AHEAD) learnAhead.push(id); }
    else if (c.st === 2 && c.due < end) review.push(id);
  }
  const byDue = (a, b) => S.cards[a].due - S.cards[b].due;
  learnNow.sort(byDue); learnAhead.sort(byDue); review.sort(byDue);
  return {learnNow, learnAhead, review};
}
function counts(lang) {
  const q = scan(lang);
  const revLeft = Math.max(0, S.settings.maxReviews - peekLog().rv);
  const langs = lang === 'all' ? ['ja', 'zh'] : [lang];
  const nw = langs.filter(langOn).reduce((a, l) => a + nextNewIds(l, newLeft(l)).length, 0);
  return {learn: q.learnNow.length + q.learnAhead.length, review: Math.min(q.review.length, revLeft), new: nw};
}
function nextDueInfo() {
  let min = Infinity; const now = Date.now(), end = dayEnd(now); let tomorrow = 0;
  for (const id in S.cards) {
    const c = S.cards[id], it = ITEMS.get(id); if (!it || c.susp || c.st === 0 || !langOn(it.lang)) continue;
    if (c.due > now) min = Math.min(min, c.due);
    if (c.st === 2 && c.due >= end && c.due < addDays(end, 1)) tomorrow++;
  }
  return {min, tomorrow};
}

/* ================= Speech ================= */
let VOICES = [];
function loadVoices() { try { VOICES = speechSynthesis.getVoices(); } catch (e) { VOICES = []; } }
if ('speechSynthesis' in window) { loadVoices(); speechSynthesis.onvoiceschanged = () => { loadVoices(); if (UI.tab === 'settings') renderView(); }; }
const voicesFor = l => VOICES.filter(v => v.lang && v.lang.replace('_', '-').toLowerCase().startsWith(l === 'ja' ? 'ja' : 'zh-cn') || (l === 'zh' && /^zh/i.test(v.lang) && /cn|hans/i.test(v.lang)));
function speak(text, lang) {
  if (!('speechSynthesis' in window)) return toast('Speech is not available in this browser');
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang === 'ja' ? 'ja-JP' : 'zh-CN';
    const pick = VOICES.find(v => v.voiceURI === S.settings.voice[lang]) || voicesFor(lang)[0];
    if (pick) u.voice = pick;
    u.rate = S.settings.rate;
    speechSynthesis.speak(u);
  } catch (e) { toast('Could not play audio'); }
}
function speakText(it) {
  if (it.kind === 'jw') return it.r;
  if (it.kind === 'jk') return [it.on[0], it.kun[0] && cleanKana(it.kun[0])].filter(Boolean).join('、') || it.head;
  return it.head;
}

/* ================= Rendering helpers ================= */
const TONE = {'ā':1,'á':2,'ǎ':3,'à':4,'ē':1,'é':2,'ě':3,'è':4,'ī':1,'í':2,'ǐ':3,'ì':4,'ō':1,'ó':2,'ǒ':3,'ò':4,'ū':1,'ú':2,'ǔ':3,'ù':4,'ǖ':1,'ǘ':2,'ǚ':3,'ǜ':4,'ń':2,'ň':3,'ǹ':4,'ḿ':2};
function toneOf(syl) { for (const ch of syl.toLowerCase()) if (TONE[ch]) return TONE[ch]; return 5; }
const pinyinHTML = py => py.split(/\s+/).filter(Boolean).map(s => `<span class="t${toneOf(s)}">${esc(s)}</span>`).join(' ');
function kunHTML(k) {
  const pre = k.startsWith('-') ? '-' : '', post = k.endsWith('-') ? '-' : '';
  const [stem, oku] = k.replace(/^-|-$/g, '').split('.');
  return esc(pre + stem) + (oku ? `<span class="oku">${esc(oku)}</span>` : '') + esc(post);
}
function readingPlain(it) {
  if (it.kind === 'jk') return [...new Set([...it.on.slice(0, 2).map(toKata), ...it.kun.slice(0, 3).map(cleanKana)])].join('、');
  if (it.kind === 'jw') return it.r + (S.settings.romaji ? '  ' + romaji(it.r) : '');
  return it.py.slice(0, 2).join(' / ');
}
function romaji(k) { try { return window.wanakana ? wanakana.toRomaji(k) : ''; } catch (e) { return ''; } }
const headSize = s => { const n = [...s].length; return n <= 1 ? 'hs-1' : n <= 2 ? 'hs-2' : n <= 4 ? 'hs-3' : 'hs-4'; };
function firstMeaning(it) { return (it.mean || '').split(/[;,]/)[0].trim(); }
function morae(kana) {
  const small = 'ゃゅょぁぃぅぇぉゎャュョァィゥェォヮ'; const out = [];
  for (const ch of kana) { if (small.includes(ch) && out.length) out[out.length - 1] += ch; else out.push(ch); }
  return out;
}
function pitchHTML(kana, n) {
  if (n == null || n < 0) return '';
  const m = morae(kana), len = m.length;
  if (!len || n > len) return '';
  const hi = i => n === 0 ? i > 0 : n === 1 ? i === 0 : (i > 0 && i < n);
  const w = 30, x0 = 12, yH = 8, yL = 30, width = (len + 1) * w;
  const pts = []; for (let i = 0; i <= len; i++) pts.push([x0 + i * w, hi(i) ? yH : yL]);
  const name = n === 0 ? 'Heiban' : n === 1 ? 'Atamadaka' : n === len ? 'Odaka' : 'Nakadaka';
  const dots = pts.map(([x, y], i) => i === len
    ? `<circle cx="${x}" cy="${y}" r="4" fill="var(--surface)" stroke="var(--brass)" stroke-width="1.6"/>`
    : `<circle cx="${x}" cy="${y}" r="4" fill="var(--brass)"/>`).join('');
  const labels = m.map((mo, i) => `<text x="${x0 + i * w}" y="54" text-anchor="middle" lang="ja" style="font:15px var(--f-ja);fill:var(--ink-2)">${esc(mo)}</text>`).join('');

/* ================= Stroke order ================= */
const STROKE_URL = {
  ja: ch => `https://cdn.jsdelivr.net/npm/hanzi-writer-data-jp@0.0.1/${encodeURIComponent(ch)}.json`,
  zh: ch => `https://cdn.jsdelivr.net/npm/hanzi-writer-data@2.0.1/${encodeURIComponent(ch)}.json`,
};
const strokeCache = new Map();
function fetchStrokes(ch, lang) {
  const key = lang + ch;
  if (!strokeCache.has(key)) {
    const get = url => fetch(url).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });
    const p = get(STROKE_URL[lang](ch)).catch(e => lang === 'ja' ? get(STROKE_URL.zh(ch)) : Promise.reject(e));
    p.catch(() => strokeCache.delete(key));
    strokeCache.set(key, p);
  }
  return strokeCache.get(key);
}
function gridSVG(size) {
  const h = size / 2;
  return `<svg class="grid" width="${size}" height="${size}" aria-hidden="true"><g stroke="var(--line-2)" stroke-width="1" stroke-dasharray="4 5"><line x1="${h}" y1="0" x2="${h}" y2="${size}"/><line x1="0" y1="${h}" x2="${size}" y2="${h}"/><line x1="0" y1="0" x2="${size}" y2="${size}" opacity=".5"/><line x1="${size}" y1="0" x2="0" y2="${size}" opacity=".5"/></g></svg>`;
}
function mountWriter(box, it) {
  const host = $('.hw', box), msg = $('.hw-msg', box), count = $('.stroke-count', box);
  if (!host || !window.HanziWriter) { if (msg) msg.textContent = 'Stroke order is unavailable.'; return null; }
  const size = Math.min(300, Math.max(200, box.clientWidth - 8));
  host.style.width = host.style.height = size + 'px';
  host.innerHTML = gridSVG(size);
  const css = getComputedStyle(document.documentElement), v = n => css.getPropertyValue(n).trim();
  msg.textContent = 'Loading strokes…';
  const writer = HanziWriter.create(host, it.head, {
    width: size, height: size, padding: 16,
    showCharacter: true, showOutline: true,
    strokeColor: v('--ink'), outlineColor: v('--line-2'), highlightColor: v('--brass'),
    drawingColor: v('--brass'), radicalColor: null, drawingWidth: 20,
    strokeAnimationSpeed: 1.1, delayBetweenStrokes: 160,
    charDataLoader: (ch, onLoad, onError) => fetchStrokes(ch, it.lang).then(onLoad).catch(onError),
    onLoadCharDataSuccess: d => { msg.textContent = 'Tap Play to watch, Trace to write it yourself.'; if (count) count.textContent = d.strokes.length + ' strokes'; },
    onLoadCharDataError: () => { msg.textContent = 'Could not load stroke data. It needs a connection the first time.'; },
  });
  return writer;
}

/* ================= Study session ================= */
let SESSION = null;
function startSession(lang) {
  SESSION = {lang, count: 0, sinceNew: 0, lastId: null, undo: [], started: Date.now(), cardStart: 0, revealed: false, cur: null, newToggle: 0};
  const el = document.createElement('div');
  el.className = 'overlay'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-label', 'Study session');
  pushLayer(el, () => { SESSION = null; renderView(); });

}
function pickNext() {
  const q = scan(SESSION.lang);
  const revLeft = Math.max(0, S.settings.maxReviews - peekLog().rv);
  const reviews = revLeft > 0 ? q.review : [];
  const langs = (SESSION.lang === 'all' ? ['ja', 'zh'] : [SESSION.lang]).filter(langOn);
  const newIds = langs.map(l => nextNewIds(l, Math.min(1, newLeft(l)))[0]).filter(Boolean);
  let newId = null;
  if (newIds.length) { newId = newIds[SESSION.newToggle % newIds.length]; }
  const notLast = arr => arr.find(id => id !== SESSION.lastId);
  const ln = notLast(q.learnNow);
  if (ln) return ln;
  const others = reviews.length || newId;
  if (q.learnNow.length && !others && !q.learnAhead.length) return q.learnNow[0];
  if (reviews.length && newId) return SESSION.sinceNew >= 3 ? newId : notLast(reviews) || reviews[0];
  if (reviews.length) return notLast(reviews) || reviews[0];
  if (newId) return newId;
  if (q.learnNow.length) return q.learnNow[0];
  if (q.learnAhead.length) return notLast(q.learnAhead) || q.learnAhead[0];
  return null;
}

}

  if (SESSION.revealed && S.settings.speakOnReveal) speak(speakText(it), it.lang);
}
function reveal() { if (!SESSION || !SESSION.cur || SESSION.revealed) return; SESSION.revealed = true; renderStudy(); }
function rate(g) {
  if (!SESSION || !SESSION.cur || !SESSION.revealed) return;
  const now = Date.now(), id = SESSION.cur, it = ITEMS.get(id);
  const prev = S.cards[id], c0 = prev || newCard();
  const next = preview(c0, now)[g];
  const key = dayKey(now), log = todayLog();
  SESSION.undo.push({id, prev: prev ? Object.assign({}, prev) : undefined, prevLog: JSON.parse(JSON.stringify(log)), key, sinceNew: SESSION.sinceNew, count: SESSION.count, newToggle: SESSION.newToggle});
  if (SESSION.undo.length > 30) SESSION.undo.shift();
  log.r++;
  if (c0.st === 0) { log.n[it.lang] = (log.n[it.lang] || 0) + 1; SESSION.newToggle++; SESSION.sinceNew = 0; } else SESSION.sinceNew++;
  if (c0.st === 2) { log.rv++; if (g > 1) log.p++; }
  log.ms += Math.min(60e3, now - SESSION.cardStart);
  if (prev && prev.susp) next.susp = true;
  S.cards[id] = next;
  SESSION.count++; SESSION.lastId = id;
  save();
  advance();
}
function undo() {
  if (!SESSION || !SESSION.undo.length) return;
  const u = SESSION.undo.pop();
  if (u.prev) S.cards[u.id] = u.prev; else delete S.cards[u.id];
  S.log[u.key] = u.prevLog;
  SESSION.sinceNew = u.sinceNew; SESSION.count = u.count; SESSION.newToggle = u.newToggle;
  SESSION.cur = u.id; SESSION.revealed = true; SESSION.cardStart = Date.now();
  save(); renderStudy();
}

  const b = UI.browse;
  const q = b.q.trim();
  let src = [];
  for (const l of ['ja', 'zh']) {
    if (!b.langs[l]) continue;
    const kinds = b.seg === 'saved' || b.seg === 'all' ? [KINDS[l].char, KINDS[l].word] : [KINDS[l][b.seg]];
    for (const k of kinds) for (const it of LISTS[k]) {
      if (b.seg === 'saved' && !S.starred[it.id]) continue;
      if (b.lv[l].length && !b.lv[l].includes(it.lv)) continue;
      src.push(it);
    }
  }
  if (!q) return src;
  const hasCJK = /[㐀-鿿豈-﫿]/.test(q);
  const hasKana = /[぀-ヿ]/.test(q);
  const ql = q.toLowerCase();
  let hira = hasKana ? toHira(q) : '';
  if (!hasKana && !hasCJK && window.wanakana) { try { const h = wanakana.toHiragana(ql); if (/^[぀-ゟー]+$/.test(h)) hira = h; } catch (e) {} }
  const pyq = toneless(ql).replace(/[\s'1-5]/g, '').replace(/v/g, 'u');
  const wordRe = new RegExp('(^|[^a-z])' + ql.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'i');
  const scored = [];
  for (const it of src) {
    let s = 0;
    if (hasCJK) {
      if (it.head === q) s = 100;
      else if (it.head.includes(q)) s = 70 - it.head.length;
      else if (isChar(it) && q.includes(it.head)) s = 80;
      else if (it.trad && (it.trad === q || it.trad.includes(q))) s = 60;
    } else {
      if (hira) {
        const rs = it.kind === 'jk' ? [...it.on, ...it.kun.map(cleanKana)] : it.kind === 'jw' ? [it.r] : [];
        for (const r of rs.map(toHira)) { if (r === hira) s = Math.max(s, 95); else if (r.startsWith(hira)) s = Math.max(s, 72); else if (hasKana && r.includes(hira)) s = Math.max(s, 40); }
      }
      if (!hasKana) {
        if (it.lang === 'zh' && pyq) {
          if (!it._pk) it._pk = it.py.map(p => toneless(p).replace(/[\s']/g, ''));
          for (const k of it._pk) { if (k === pyq) s = Math.max(s, 92); else if (k.startsWith(pyq) && pyq.length > 1) s = Math.max(s, 66); }
        }
        const m = it.mean.toLowerCase();
        const segs = m.split(/[;,]/).map(x => x.trim().replace(/^to /, ''));
        if (segs.includes(ql) || segs.includes(ql.replace(/^to /, ''))) s = Math.max(s, 90);
        else if (wordRe.test(m)) s = Math.max(s, 55 - Math.min(20, m.length / 8));
      }
    }
    if (s) scored.push([s, it]);
  }
  scored.sort((a, b) => b[0] - a[0] || a[1].ord - b[1].ord);
  return scored.map(x => x[1]);
}

/* ---- Stats ---- */
function renderStats() {
  const st = streaks(), log = peekLog();
  let rv = 0, p = 0;
  for (let i = 0; i < 30; i++) { const l = peekLog(dayKey(addDays(dayStart(), -i))); rv += l.rv || 0; p += l.p || 0; }
  const ret = rv >= 10 ? Math.round(p / rv * 100) + '%' : 'n/a';
  let total = 0, mature = 0;
  for (const id in S.cards) { const c = S.cards[id]; if (c.st >= 1) total++; if (c.st === 2 && c.s >= 21) mature++; }
  const progRows = ['ja', 'zh'].filter(langOn).map(l => {
    const rows = [];
    for (const kind of [KINDS[l].char, KINDS[l].word]) for (const lv of LEVELS[l]) {
      const items = LISTS[kind].filter(it => it.lv === lv);
      const started = items.filter(it => S.cards[it.id] && S.cards[it.id].st >= 1).length;
      const enabled = S.settings.decks[kind].includes(lv);
      if (!started && !enabled) continue;
      rows.push(`<div class="prog"><span>${lvLabel(l, lv)} ${kind === KINDS[l].char ? 'chars' : 'words'}</span><span class="bar"><i style="width:${items.length ? started / items.length * 100 : 0}%"></i></span><span>${started} / ${items.length}</span></div>`);
    }
    return rows.length ? `<div class="panel"><h3>${LANG_NAME[l]}</h3>${rows.join('')}</div>` : '';
  }).join('');
  return `
  <p class="kicker">Your record</p><h1>Stats</h1>
  <div class="section tiles">
    <div class="tile"><span class="kicker">Streak</span><b>${st.cur}</b><small>best ${st.best}</small></div>
    <div class="tile"><span class="kicker">Today</span><b>${log.r}</b><small>${Math.round((log.ms || 0) / MIN)} min studied</small></div>
    <div class="tile"><span class="kicker">Retention</span><b>${ret}</b><small>last 30 days</small></div>
    <div class="tile"><span class="kicker">Started</span><b>${total.toLocaleString()}</b><small>${mature.toLocaleString()} mature</small></div>
  </div>
  <div class="section panel"><h3>Reviews per day</h3><div id="heat"></div><p class="chart-tip" id="heat-tip">Tap a day for its count.</p></div>
  <div class="section panel"><h3>Due in the next 14 days</h3><div id="bars"></div><p class="chart-tip" id="bars-tip"></p><details><summary>Show as table</summary><div id="bars-table"></div></details></div>
  <div class="section">${progRows || '<p class="faint">Switch on a language to see level progress.</p>'}</div>`;
}
function drawHeatmap() {
  const host = $('#heat'); if (!host) return;
  const cell = 12, gap = 3, left = 18, top = 16;
  const width = host.clientWidth || 320;
  const weeks = clamp(Math.floor((width - left + gap) / (cell + gap)), 10, 53);
  const today = dayStart(), dow = (new Date(today).getDay() + 6) % 7;
  const start = addDays(today, -((weeks - 1) * 7 + dow));
  const vals = [];
  for (let w = 0; w < weeks; w++) for (let d = 0; d < 7; d++) {
    const t = addDays(start, w * 7 + d); if (t > today) continue;
    const k = dayKey(t); vals.push({w, d, t, k, v: peekLog(k).r || 0});
  }
  const vmax = Math.max(1, ...vals.map(x => x.v));
  const level = v => !v ? 0 : clamp(Math.ceil(v / vmax * 4), 1, 4);
  let months = '', lastM = -1, lastW = -9;
  for (let w = 0; w < weeks; w++) {
    const first = new Date(addDays(start, w * 7)), m = first.getMonth();
    if (m !== lastM) { lastM = m; if (w - lastW >= 3 && w < weeks - 2 && (w > 0 || first.getDate() <= 8)) { months += `<text x="${left + w * (cell + gap)}" y="10">${first.toLocaleDateString(undefined, {month: 'short'})}</text>`; lastW = w; } }
  }
  const days = ['M', '', 'W', '', 'F', '', ''].map((n, i) => n ? `<text x="0" y="${top + i * (cell + gap) + 10}">${n}</text>` : '').join('');
  const cells = vals.map(x => `<rect class="cell" data-k="${x.k}" data-v="${x.v}" x="${left + x.w * (cell + gap)}" y="${top + x.d * (cell + gap)}" width="${cell}" height="${cell}" rx="2" fill="var(--heat-${level(x.v)})"${x.t === today ? ' stroke="var(--brass)" stroke-width="1.5"' : ''}/>`).join('');
  const W = left + weeks * (cell + gap), H = top + 7 * (cell + gap);
  host.innerHTML = `<svg class="heat" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Reviews per day over the last ${weeks} weeks">${months}${days}${cells}</svg>
    <div class="legend">Less${[0, 1, 2, 3, 4].map(i => `<i style="background:var(--heat-${i})"></i>`).join('')}More</div>`;
  const tip = $('#heat-tip');
  const show = e => { const r = e.target.closest('rect.cell'); if (!r) return; const dt = new Date(r.dataset.k + 'T12:00:00'); tip.textContent = `${dt.toLocaleDateString(undefined, {weekday: 'short', day: 'numeric', month: 'short'})}: ${r.dataset.v} review${r.dataset.v === '1' ? '' : 's'}`; };
  host.addEventListener('pointerover', show); host.addEventListener('click', show);
}
function drawBars() {
  const host = $('#bars'); if (!host) return;
  const base = dayStart(), n = 14, vals = new Array(n).fill(0);
  for (const id in S.cards) {
    const c = S.cards[id], it = ITEMS.get(id); if (!it || c.susp || c.st !== 2 || !langOn(it.lang)) continue;
    const i = Math.max(0, Math.round((dayStart(c.due) - base) / DAY));
    if (i < n) vals[i]++;
  }
  const width = host.clientWidth || 320, H = 150, padB = 20, padT = 18;
  const slot = width / n, bw = Math.max(6, slot - 6), max = Math.max(1, ...vals);
  const maxI = vals.indexOf(Math.max(...vals));
  const bars = vals.map((v, i) => {
    const h = v ? Math.max(3, (H - padB - padT) * v / max) : 0, x = i * slot + (slot - bw) / 2, y = H - padB - h;
    const r = Math.min(4, h, bw / 2);
    const path = h ? `M${x},${H - padB}V${y + r}Q${x},${y} ${x + r},${y}H${x + bw - r}Q${x + bw},${y} ${x + bw},${y + r}V${H - padB}Z` : '';
    const label = (i === 0 || i === maxI) && v ? `<text x="${x + bw / 2}" y="${y - 5}" text-anchor="middle" style="fill:var(--ink-2)">${v}</text>` : '';
    return `<g data-i="${i}" data-v="${v}"><rect x="${i * slot}" y="0" width="${slot}" height="${H}" fill="transparent"/>${path ? `<path d="${path}" fill="${i === 0 ? 'var(--brass)' : 'var(--brass-2)'}" opacity="${i === 0 ? 1 : .75}"/>` : ''}${label}</g>`;
  }).join('');
  const xl = [[0, 'start', 2], [7, 'middle', 7 * slot + slot / 2], [13, 'end', width - 2]].map(([i, a, x]) => `<text x="${x}" y="${H - 5}" text-anchor="${a}">${i === 0 ? 'Today' : '+' + i + 'd'}</text>`).join('');
  host.innerHTML = `<svg class="bars" width="${width}" height="${H}" viewBox="0 0 ${width} ${H}" role="img" aria-label="Reviews due over the next 14 days, ${vals[0]} today"><line x1="0" x2="${width}" y1="${H - padB}" y2="${H - padB}" stroke="var(--line-2)"/>${bars}${xl}</svg>`;
  const tip = $('#bars-tip');
  const label = i => i === 0 ? 'Today' : new Date(addDays(base, i)).toLocaleDateString(undefined, {weekday: 'short', day: 'numeric', month: 'short'});
  const show = e => { const g = e.target.closest('g[data-i]'); if (!g) return; tip.textContent = `${label(+g.dataset.i)}: ${g.dataset.v} due`; };
  host.addEventListener('pointerover', show); host.addEventListener('click', show);
  tip.textContent = `${vals.reduce((a, b) => a + b, 0)} reviews over the next two weeks.`;
  $('#bars-table').innerHTML = `<table class="tbl"><tr><th>Day</th><th>Due</th></tr>${vals.map((v, i) => `<tr><td>${label(i)}</td><td>${v}</td></tr>`).join('')}</table>`;
}

/* ---- Onboarding ---- */
function openOnboarding() {
  const draft = {langs: {ja: true, zh: true}, lv: {ja: 5, zh: 1}, words: true, n: 10};
  const html = () => `
    <p class="kicker">Welcome</p><h1 style="font-size:38px">Set up Inkstone</h1>
    <p class="muted" style="margin-top:10px">A few minutes a day. Everything can be changed later in Settings.</p>
    <div class="section"><h3>What are you studying?</h3><div class="chips">${['ja', 'zh'].map(l => `<button class="chip" data-ob-lang="${l}" aria-pressed="${draft.langs[l]}">${l === 'ja' ? 'Japanese kanji' : 'Chinese hanzi'}</button>`).join('')}</div></div>
    ${['ja', 'zh'].filter(l => draft.langs[l]).map(l => `<div class="section"><h3>${LANG_NAME[l]} level to start with</h3><div class="chips">${LEVELS[l].map(lv => `<button class="chip" data-ob-lv="${l}:${lv}" aria-pressed="${draft.lv[l] === lv}">${lvLabel(l, lv)}</button>`).join('')}</div></div>`).join('')}
    <div class="section"><div class="set" style="border:0;padding:0"><span class="lbl">Include vocabulary decks</span><button class="switch" role="switch" aria-checked="${draft.words}" data-ob-words aria-label="Include vocabulary"></button><span class="help">Words at the same level, mixed in with the characters.</span></div></div>
    <div class="section"><div class="spread"><h3 style="margin:0">New cards per day, per language</h3><span class="val" id="ob-nv">${draft.n}</span></div><input type="range" min="3" max="50" value="${draft.n}" data-ob-n style="margin-top:10px"></div>
    <button class="btn primary block section" data-ob-go ${draft.langs.ja || draft.langs.zh ? '' : 'disabled'}>Begin</button>`;
  const sheet = openSheet(`<div data-ob>${html()}</div>`);
  const root = $('[data-ob]', sheet);
  const re = () => { root.innerHTML = html(); };
  root.addEventListener('click', e => {
    const t = e.target.closest('button'); if (!t) return;
    if (t.dataset.obLang) { draft.langs[t.dataset.obLang] = !draft.langs[t.dataset.obLang]; re(); }
    else if (t.dataset.obLv) { const [l, lv] = t.dataset.obLv.split(':'); draft.lv[l] = +lv; re(); }
    else if (t.hasAttribute('data-ob-words')) { draft.words = !draft.words; re(); }
    else if (t.hasAttribute('data-ob-go')) {
      const s = S.settings;
      s.langs = {ja: draft.langs.ja, zh: draft.langs.zh};
      s.decks = {jk: [draft.lv.ja], jw: draft.words ? [draft.lv.ja] : [], hz: [draft.lv.zh], zw: draft.words ? [draft.lv.zh] : []};
      s.newPerDay = {ja: draft.n, zh: draft.n};
      s.onboarded = true;
      invalidatePool(); save(true); popLayer(); renderView();
    }
  });
  root.addEventListener('input', e => { if (e.target.hasAttribute('data-ob-n')) { draft.n = +e.target.value; $('#ob-nv', root).textContent = draft.n; } });
}

/* ================= Events ================= */
document.addEventListener('click', e => {
  const t = e.target.closest('button,[data-act],[data-open]');
  if (!t) return;

  if (d.tab) { if (LAYERS.length) while (LAYERS.length) popLayer(); return setTab(d.tab); }
  if (d.speak !== undefined && d.speak !== '') { e.stopPropagation(); return speak(d.speak, d.lang); }
  if (d.rate) return rate(+d.rate);
  if (d.open) {
    const it = ITEMS.get(d.open);
    const open = LAYERS.length && $('.sheet', LAYERS[LAYERS.length - 1].el);
    if (open && open.dataset.id === d.open) return;
    return openItem(d.open);
  }
  if (d.seg) { UI.browse.seg = d.seg; UI.browse.limit = 100; return renderView(); }
  if (d.blang) { UI.browse.langs[d.blang] = !UI.browse.langs[d.blang]; if (!UI.browse.langs.ja && !UI.browse.langs.zh) UI.browse.langs[d.blang === 'ja' ? 'zh' : 'ja'] = true; UI.browse.limit = 100; return renderView(); }
  if (d.blv) { const [l, lv] = d.blv.split(':'); const arr = UI.browse.lv[l]; const i = arr.indexOf(+lv); i >= 0 ? arr.splice(i, 1) : arr.push(+lv); t.setAttribute('aria-pressed', i < 0); UI.browse.limit = 100; return renderBrowseResults(); }
  if (d.deck) {
    const [kind, lv] = d.deck.split(':'); const arr = S.settings.decks[kind]; const i = arr.indexOf(+lv);
    i >= 0 ? arr.splice(i, 1) : arr.push(+lv); arr.sort((a, b) => a - b);
    t.setAttribute('aria-pressed', i < 0); invalidatePool(); save(); return;
  }
  if (d.toggle) {
    const on = t.getAttribute('aria-checked') !== 'true';
    if (d.toggle.startsWith('lang:')) S.settings.langs[d.toggle.slice(5)] = on; else S.settings[d.toggle] = on;
    invalidatePool(); save(); return renderView();
  }
  if (d.themeSet) { S.settings.theme = d.themeSet; save(); applyTheme(); return renderView(); }
  if (d.cjkSet) { S.settings.cjkFont = d.cjkSet; save(); applyTheme(); return renderView(); }
  if (d.wsrc) { S.settings.widget.src = d.wsrc; save(); return renderView(); }
  if (d.wkind) { const w = S.settings.widget; w[d.wkind] = !w[d.wkind]; if (!w.chars && !w.words) w[d.wkind === 'chars' ? 'words' : 'chars'] = true; save(); return renderView(); }
  switch (d.act) {
    case 'study': return startSession(d.lang);
    case 'reveal': return reveal();
    case 'undo': return undo();
    case 'close-layer': return popLayer();
    case 'more-new': { const log = todayLog(); const langs = (SESSION.lang === 'all' ? ['ja', 'zh'] : [SESSION.lang]).filter(langOn); langs.forEach(l => log.x[l] = (log.x[l] || 0) + 5); save(); return advance(); }
    case 'more-results': UI.browse.limit += 150; return renderBrowseResults();
    case 'open-strokes': return openItem(d.id, {strokes: true});
    case 'star': {
      const on = !S.starred[d.id]; if (on) S.starred[d.id] = 1; else delete S.starred[d.id];
      t.setAttribute('aria-pressed', on); t.innerHTML = on ? ICON.starOn : ICON.star; t.setAttribute('aria-label', on ? 'Remove from saved' : 'Save');
      invalidatePool(); save(); refreshProgress(d.id); toast(on ? 'Saved. It comes up first in new cards.' : 'Removed from saved'); return;
    }
    case 'suspend': { const c = S.cards[d.id]; if (c) { c.susp = !c.susp; save(); refreshProgress(d.id); } return; }
    case 'reset-card': if (confirm('Reset this card to new? Its review history will be cleared.')) { delete S.cards[d.id]; save(); refreshProgress(d.id); } return;
    case 'hw-play': case 'hw-trace': case 'hw-show': {
      const sheet = t.closest('.sheet'), w = sheet && WRITERS.get(sheet), msg = sheet && $('.hw-msg', sheet); if (!w) return;
      if (d.act === 'hw-play') { w.cancelQuiz && w.cancelQuiz(); w.showOutline(); w.hideCharacter(); w.animateCharacter(); msg.textContent = 'Watch the order, then try Trace.'; }
      else if (d.act === 'hw-show') { w.cancelQuiz && w.cancelQuiz(); w.showCharacter(); msg.textContent = ''; }
      else {
        w.hideCharacter(); w.showOutline();
        msg.textContent = 'Draw each stroke in order. A hint appears after two misses.';
        w.quiz({showHintAfterMisses: 2, leniency: 1.1, highlightOnComplete: true, onComplete: s => { msg.textContent = s.totalMistakes ? `Done with ${s.totalMistakes} miss${s.totalMistakes === 1 ? '' : 'es'}.` : 'Clean. No misses.'; }});
      }
      return;
    }
    case 'export': return exportData();
    case 'widget-send': return sendToWidget();
    case 'widget-file': return saveWidgetFile();
    case 'widget-script': return copyScript();
    case 'cache-strokes': return cacheStrokes(t);
    case 'reset-all':
      if (confirm('Erase all progress, notes and saved items? Settings are kept. Export first if unsure.')) { S = normalize({settings: S.settings}); invalidatePool(); save(true); renderView(); toast('Progress reset'); }
      return;
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'q') { UI.browse.q = t.value; UI.browse.limit = 100; clearTimeout(t._tm); t._tm = setTimeout(renderBrowseResults, 140); return; }
  if (t.dataset.note) { const id = t.dataset.note; const v = t.value.trim(); if (v) S.notes[id] = t.value; else delete S.notes[id]; save(); return; }
  if (t.dataset.range) {
    const [k, l] = t.dataset.range.split(':');
    if (k === 'new') { S.settings.newPerDay[l] = +t.value; $('#npv-' + l).textContent = t.value; }
    else if (k === 'ret') { S.settings.retention = +t.value / 100; $('#retv').textContent = t.value + '%'; }
    else if (k === 'rate') { S.settings.rate = +t.value; $('#ratev').textContent = (+t.value).toFixed(2) + '×'; }
    save();
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.voice) { S.settings.voice[t.dataset.voice] = t.value; save(); speak(t.dataset.voice === 'ja' ? 'にほんご' : '你好', t.dataset.voice); }
  if (t.dataset.wmax !== undefined) { S.settings.widget.max = +t.value; save(); renderView(); }
  if (t.dataset.num) { S.settings[t.dataset.num] = clamp(Math.round(+t.value || 0), 10, 9999); t.value = S.settings[t.dataset.num]; save(); }
  if (t.id === 'imp' && t.files[0]) importData(t.files[0]);
});
document.addEventListener('keydown', e => {
  if (e.target.matches('input,textarea,select')) { if (e.key === 'Escape') e.target.blur(); return; }
  const top = LAYERS[LAYERS.length - 1];
  if (e.key === 'Escape' && top) { e.preventDefault(); return popLayer(); }
  if (SESSION && top && top.el.classList.contains('overlay')) {
    if ((e.key === ' ' || e.key === 'Enter') && !SESSION.revealed) { e.preventDefault(); return reveal(); }
    if (SESSION.revealed && '1234'.includes(e.key)) { e.preventDefault(); return rate(+e.key); }
    if (SESSION.revealed && (e.key === ' ' || e.key === 'Enter')) { e.preventDefault(); return rate(3); }
    if (e.key === 'z' || e.key === 'Backspace') { e.preventDefault(); return undo(); }
  }
});
let resizeTm;
window.addEventListener('resize', () => { clearTimeout(resizeTm); resizeTm = setTimeout(() => { if (UI.tab === 'stats') { drawHeatmap(); drawBars(); } }, 200); });
if (window.matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', applyTheme);

/* ================= Data import / export / caching ================= */
function exportData() {
  const blob = new Blob([JSON.stringify({app: 'inkstone', exported: new Date().toISOString(), ...S})], {type: 'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = `inkstone-backup-${dayKey()}.json`;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  toast('Backup exported');
}
function importData(file) {
  const r = new FileReader();
  r.onload = () => {
    try {
      const o = JSON.parse(r.result);
      if (o.app !== 'inkstone' || !o.cards) throw new Error('bad');
      if (!confirm(`Replace current progress with this backup (${Object.keys(o.cards).length} cards)?`)) return;
      S = normalize(o); invalidatePool(); save(true); applyTheme(); renderView(); toast('Backup restored');
    } catch (e) { toast('That file is not an Inkstone backup'); }
  };
  r.readAsText(file);
}
async function cacheStrokes(btn) {
  const chars = [];
  for (const l of ['ja', 'zh']) { if (!langOn(l)) continue; const k = KINDS[l].char; for (const it of LISTS[k]) if (S.settings.decks[k].includes(it.lv)) chars.push([it.head, l]); }
  if (!chars.length) return toast('Select some character levels first');
  btn.disabled = true; let done = 0, failed = 0, i = 0;
  const worker = async () => { while (i < chars.length) { const [ch, l] = chars[i++]; try { await fetchStrokes(ch, l); } catch (e) { failed++; } done++; if (done % 10 === 0 || done === chars.length) btn.textContent = `${done}/${chars.length}`; } };
  await Promise.all(Array.from({length: 6}, worker));
  btn.textContent = 'Done'; btn.disabled = false;
  toast(failed ? `Saved ${done - failed}, ${failed} failed` : `Saved stroke data for ${done} characters`);
}


/* ================= Lock screen widget (via Scriptable) ================= */
const WIDGET_SCRIPT_NAME = 'Inkstone';
function widgetItems() {
  const w = S.settings.widget;
  const ok = it => it && langOn(it.lang) && (isChar(it) ? w.chars : w.words);
  let list = [];
  if (w.src === 'saved') list = Object.keys(S.starred).map(id => ITEMS.get(id)).filter(ok);
  else if (w.src === 'levels') {
    // Interleave languages and characters/words so a cap never cuts one of them out entirely.
    const groups = [];
    for (const l of ['ja', 'zh']) for (const kind of [KINDS[l].char, KINDS[l].word])
      groups.push(LISTS[kind].filter(it => S.settings.decks[kind].includes(it.lv) && ok(it)));
    for (let i = 0; groups.some(g => i < g.length); i++) for (const g of groups) if (g[i]) list.push(g[i]);
  } else {
    // What I'm learning: cards already started, weakest memories first, then the next new cards in line.
    const started = Object.keys(S.cards).filter(id => S.cards[id].st >= 1 && !S.cards[id].susp).map(id => ITEMS.get(id)).filter(ok)
      .sort((a, b) => S.cards[a.id].s - S.cards[b.id].s);
    const nx = ['ja', 'zh'].filter(langOn).map(l => nextNewIds(l, 40).map(id => ITEMS.get(id)).filter(ok));
    const upcoming = [];
    for (let i = 0; i < 40; i++) for (const g of nx) if (g[i]) upcoming.push(g[i]);
    const seen = new Set();
    list = [...started, ...upcoming].filter(it => !seen.has(it.id) && seen.add(it.id));
  }
  return list.slice(0, w.max);
}
function widgetReading(it) {
  if (it.kind === 'jk') return [...new Set([it.on[0] && toKata(it.on[0]), it.kun[0] && cleanKana(it.kun[0])].filter(Boolean))].join('・');
  if (it.kind === 'jw') return it.r;
  return it.py[0] || '';
}
function widgetMeaning(it) {
  const parts = it.mean.split(/;\s*| · /).map(x => x.replace(/^[a-zāáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜ ]+:\s*/i, '').trim()).filter(Boolean);
  let m = '';
  for (const p of parts) { const next = m ? m + '; ' + p : p; if (next.length > 44 && m) break; m = next; }
  return m;
}
function widgetDeck() {
  const items = widgetItems().map(it => {
    const o = {id: it.id, l: it.lang, k: it.kind, h: it.head, r: widgetReading(it), m: widgetMeaning(it), lv: lvLabel(it.lang, it.lv)};
    if (S.settings.romaji && it.lang === 'ja') o.ro = romaji(it.kind === 'jw' ? it.r : cleanKana(it.kun[0] || it.on[0] || ''));
    return o;
  });
  const url = /^https?:/.test(location.protocol) ? location.origin + location.pathname : '';
  return {app: 'inkstone-widget', v: 1, generated: new Date().toISOString(), url, items};
}
function widgetPreviewHTML() {
  const d = widgetDeck(), it = d.items[0];
  if (!it) return `<p class="faint" style="margin-top:8px">Nothing to show yet. ${S.settings.widget.src === 'saved' ? 'Save some cards first.' : 'Study a few cards or pick levels above.'}</p>`;
  const n = [...it.h].length;
  return `<div class="lockprev" aria-label="Lock screen preview"><div class="w"><span class="h${n > 2 ? ' w3' : n > 1 ? ' w2' : ''}" lang="${it.l === 'ja' ? 'ja' : 'zh-Hans'}">${esc(it.h)}</span><span class="t"><span${it.l === 'ja' ? ' lang="ja"' : ''}>${esc(it.ro ? it.r + '  ' + it.ro : it.r)}</span><span class="m">${esc(it.m)}</span></span></div></div>
    <p class="help" style="margin-top:8px">${d.items.length} card${d.items.length === 1 ? '' : 's'} ready. The widget rotates through them.</p>`;
}
function widgetPanel() {
  const w = S.settings.widget;
  const src = [['learning', 'Learning'], ['saved', 'Saved'], ['levels', 'My levels']];
  const help = {learning: 'Cards you have started, weakest first, plus the next new cards in your queue.', saved: 'Only the cards you starred.', levels: 'Everything in the levels you selected above.'}[w.src];
  return `<div class="section" id="widget-panel"><h3>Lock screen widget</h3><div class="panel">
    <div class="set col"><span class="lbl">Cards to show</span><div class="seg">${src.map(([k, n]) => `<button data-wsrc="${k}" aria-pressed="${w.src === k}">${n}</button>`).join('')}</div><span class="help">${help}</span></div>
    <div class="set"><span class="lbl">Include</span><div class="chips"><button class="chip" data-wkind="chars" aria-pressed="${w.chars}">Characters</button><button class="chip" data-wkind="words" aria-pressed="${w.words}">Words</button></div></div>
    <div class="set"><label for="wmax">Maximum cards</label><select id="wmax" data-wmax>${[50, 100, 200, 500, 1000].map(n => `<option value="${n}"${w.max === n ? ' selected' : ''}>${n}</option>`).join('')}</select></div>
    <div class="set col"><span class="lbl">Preview</span>${widgetPreviewHTML()}</div>
    <div class="set col"><div class="rowflex"><button class="btn primary small" data-act="widget-send">Send to widget</button><button class="btn small" data-act="widget-file">Save as file</button><button class="btn small" data-act="widget-script">Copy script</button></div>
      <span class="help">Send to widget copies your cards and opens Scriptable, which saves them for the widget. Send again when you move on to new cards; the widget does not see your progress on its own.</span></div>
    <details><summary>First-time setup</summary><ol class="steps">
      <li>Install <a href="https://apps.apple.com/app/id1405459188" target="_blank" rel="noopener" style="color:var(--brass)">Scriptable</a> from the App Store. It is free.</li>
      <li>Tap Copy script. In Scriptable tap +, paste, and name the script <code class="p">${WIDGET_SCRIPT_NAME}</code> exactly.</li>
      <li>Come back and tap Send to widget. Allow it to open Scriptable.</li>
      <li>Long-press the Lock Screen, tap Customise, tap the widget area and add Scriptable. Tap the new widget and set Script to ${WIDGET_SCRIPT_NAME}.</li>
      <li>Later updates to the widget: run the Inkstone script in Scriptable and choose Update script from website.</li>
      <li>Optional parameter on the widget: <code class="p">ja</code> or <code class="p">zh</code>, <code class="p">chars</code> or <code class="p">words</code>, <code class="p">quiz</code> to hide meanings, <code class="p">20m</code> for the rotation interval, <code class="p">#2</code> to make a second widget show different cards.</li>
    </ol></details>
  </div></div>`;
}
async function sendToWidget() {
  const deck = widgetDeck();
  if (!deck.items.length) return toast('No cards to send yet');
  try {
    await navigator.clipboard.writeText(JSON.stringify(deck));
  } catch (e) {
    return toast('Could not copy. Use Save as file instead.');
  }
  toast(`${deck.items.length} cards copied. Opening Scriptable…`);
  setTimeout(() => { location.href = `scriptable:///run/${encodeURIComponent(WIDGET_SCRIPT_NAME)}?import=clipboard`; }, 350);
}
async function shareOrDownload(name, text, type) {
  const file = new File([text], name, {type});
  if (navigator.canShare && navigator.canShare({files: [file]})) {
    try { await navigator.share({files: [file]}); return; } catch (e) { if (e && e.name === 'AbortError') return; }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(file); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
function saveWidgetFile() {
  const deck = widgetDeck();
  if (!deck.items.length) return toast('No cards to save yet');
  shareOrDownload('inkstone-widget.json', JSON.stringify(deck), 'application/json');
}
async function copyScript() {
  const src = document.getElementById('scriptable-src').textContent.trim();
  try { await navigator.clipboard.writeText(src); toast('Script copied. Paste it into a new Scriptable script.'); }
  catch (e) { shareOrDownload('Inkstone.js', src, 'text/javascript'); }
}
function handleHash() {
  if (location.hash === '#widget') {
    history.replaceState(null, '', location.pathname + location.search);
    while (LAYERS.length) popLayer();
    setTab('settings');
    const el = document.getElementById('widget-panel');
    if (el) setTimeout(() => el.scrollIntoView({block: 'start', behavior: 'smooth'}), 60);
    return;
  }
  const m = location.hash.match(/^#item=(.+)$/);
  if (!m) return;
  const id = decodeURIComponent(m[1]);
  history.replaceState(null, '', location.pathname + location.search);
  if (ITEMS.has(id)) { while (LAYERS.length) popLayer(); openItem(id); }
}

/* ================= Boot ================= */
applyTheme();
renderView();
if (!S.settings.onboarded) openOnboarding(); else handleHash();
window.addEventListener('hashchange', handleHash);
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('./sw.js').catch(() => {});
window.__inkstone = {S: () => S, ITEMS, stepCard, preview, pool, counts, scan, widgetDeck};
})();
</script>
